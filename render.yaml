services:
  - type: web
    name: speak-snap-backend
    runtime: docker

    rootDir: backend

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: PYTHON_VERSION
        value: "3.11.9"